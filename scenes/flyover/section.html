<section class="scene scene-flyover" id="flyover" aria-labelledby="flyover-h" data-stops="{{stop_times}}">
  <canvas class="fo-amb" width="24" height="40" aria-hidden="true"></canvas>
  <div class="wide fo-head reveal">
    <h2 class="h2 split" id="flyover-h">{{h2}}</h2>
    <p class="sub">{{sub}}</p>
  </div>
  <div class="fo-film reveal" style="--d:.06s">
    <div class="fo-call fo-c1" aria-hidden="true"><b>{{stop1_title}}</b><span>{{stop1_value}}</span><i></i></div>
    <div class="fo-device tilt-in">
      <div class="phone"><div class="screen-wrap">
        <img class="fo-poster" src="media/flyover/poster-v2-400.webp" srcset="media/flyover/poster-v2-400.webp 400w, media/flyover/poster-v2-800.webp 800w" sizes="(max-width: 899px) 78vw, 380px" width="886" height="1920" loading="lazy" decoding="async" alt="{{alt}}">
        <video class="fo-video" muted playsinline preload="none" disablepictureinpicture aria-hidden="true" tabindex="-1" data-src-mp4="media/flyover/film-calm-v2.mp4" data-src-webm="media/flyover/film-calm-v2.webm"></video>
      </div></div>
      <button class="fo-replay" type="button" hidden><svg class="fo-ip" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg><svg class="fo-ir" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4.6 4.2v5.4H10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="fo-again">{{replay}}</span><span class="fo-play">{{play}}</span></button>
    </div>
    <div class="fo-call fo-c2" aria-hidden="true"><b>{{stop2_title}}</b><span>{{stop2_value}}</span><i></i></div>
  </div>
</section>
