<section class="scene scene-flyover" id="flyover" aria-labelledby="flyover-h" data-stops="{{stop_times}}">
  <canvas class="fo-amb" width="24" height="40" aria-hidden="true"></canvas>
  <div class="wide fo-head reveal">
    <p class="kicker">{{kicker}}</p>
    <h2 class="h2 split" id="flyover-h">{{h2}}</h2>
    <p class="sub">{{sub}}</p>
  </div>
  <div class="fo-film">
    <div class="fo-call fo-c1" aria-hidden="true"><b>{{stop1_title}}</b><span>{{stop1_value}}</span><i></i></div>
    <div class="fo-device">
      <div class="phone"><div class="screen-wrap">
        <img class="fo-poster" src="media/flyover/poster-400.webp" srcset="media/flyover/poster-400.webp 400w, media/flyover/poster-800.webp 800w" sizes="(max-width: 899px) 78vw, 380px" width="1206" height="2622" loading="lazy" decoding="async" alt="{{alt}}">
      </div></div>
    </div>
    <div class="fo-call fo-c2" aria-hidden="true"><b>{{stop2_title}}</b><span>{{stop2_value}}</span><i></i></div>
  </div>
  <div class="wide">
    <ul class="fo-facts">
      <li class="reveal" style="--d:0s"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l5-9 4 6 3-4 6 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="17" cy="6" r="2" fill="currentColor"/></svg><p>{{fact1}}</p></li>
      <li class="reveal" style="--d:.08s"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 13V9M10 3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><p>{{fact2}}</p></li>
      <li class="reveal" style="--d:.16s"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><p>{{fact3}}</p></li>
    </ul>
    <p class="fo-free reveal">{{free_note}}</p>
  </div>
</section>
