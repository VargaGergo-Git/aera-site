<script>
// The link that travels beside a shared Flyover video (the app's ShareAddress.replayCaption; the path stays
// /replay because builds in people's hands send it). On an iPhone or iPad: on to the App Store after a moment,
// so the Cloudflare beacon can count the visit first (go anyway at 1.5 s). Anywhere else the App Store can't
// install an iPhone app, so the page stays: the film, the store picture's line and a code to scan with the
// iPhone (the scan opens this same page there). Link previews read the meta above and never run this.
(function () {
  var store = "https://apps.apple.com/app/id6762456252?pt=128795793&ct=share-replay&mt=8";
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    var go = function () { location.replace(store); };
    addEventListener('load', function () { setTimeout(go, 400); });
    setTimeout(go, 1500);
    return;
  }
  document.documentElement.className = 'desk';
  var words = {
    en: ["Where did you run?", "Fly over it in 3D.",
         "Aera turns a run, walk or ride into a 3D film over the real ground. Free for the last 7 days.",
         "Point your iPhone's camera at the code to get Aera.", "Or open the App Store page",
         "For iPhone and Apple Watch. Free to start. No account."],
    hu: ["Merre futottál?", "Repüld végig 3D\u2011ben.",
         "Az Aera a futásodból, sétádból vagy bringázásodból 3D-s filmet készít a valódi terep fölött. Az elmúlt 7 nap ingyen.",
         "Irányítsd rá az iPhone-od kameráját, és megnyílik az Aera az App Store-ban.", "Vagy nyisd meg az App Store-oldalt",
         "iPhone-ra és Apple Watch-ra. Ingyen letölthető. Regisztráció nélkül."],
    de: ["Wo bist du gelaufen?", "Flieg drüber in 3D.",
         "Aera macht aus deinem Lauf, deiner Wanderung oder Radtour einen 3D-Film über echtem Gelände. Die letzten 7 Tage kostenlos.",
         "Richte die Kamera deines iPhones auf den Code, dann öffnet sich Aera im App Store.", "Oder öffne die App-Store-Seite",
         "Für iPhone und Apple Watch. Kostenlos, ohne Konto."]
  };
  var lang = (navigator.language || 'en').slice(0, 2);
  if (!words[lang]) lang = 'en';
  addEventListener('DOMContentLoaded', function () {
    document.documentElement.lang = lang;
    ['q', 'a', 'line', 'scan', 'link', 'fine'].forEach(function (id, i) { document.getElementById(id).textContent = words[lang][i]; });
    document.getElementById('film').src = '/assets/share/flyover-' + lang + '.jpg';
    import('/plan/qr.mjs').then(function (m) {
      document.getElementById('code').innerHTML = m.qrSvg(location.origin + location.pathname, { dark: '#1c1c1e', light: '#ffffff' });
    });
  });
})();
</script>
