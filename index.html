ne writes to Apple Health and tells you what those numbers mean for you. Sleep, stress, strain and every run are held against your own usual, said in plain words, and each number opens a short article on how it was worked out. It also plans routes with turn-by-turn directions and replays runs in 3D."}}, {"@type": "Question", "name": "Do I need an Apple Watch?", "acceptedAnswer": {"@type": "Answer", "text": "No. Aera reads Apple Health, so any watch, ring or app that writes your sleep, heart rate and workouts there will do: Apple Watch, Garmin, Oura, WHOOP and others. With only an iPhone, Aera works from steps and workouts, and the reads that need overnight heart data wait until there is some."}}, {"@type": "Question", "name": "Is Aera free?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Your scores every day with their last 30 days, the 3D replay of every run from the past week, the route planner with turn by turn, five saved routes, the Field Guide and the last 30 days of every export are free. Premium keeps your whole history, every replay however old, the replay as a video to share, more saved routes and the longer reports. The yearly plan starts with a free week."}}, {"@type": "Question", "name": "Do I need an account, and where does my data go?", "acceptedAnswer": {"@type": "Answer", "text": "There is no account. Aera reads Apple Health on your iPhone and works out every score there, so health numbers stay on your iPhone. Usage counts stay off until you turn them on (in the UK and Switzerland, until you turn them off), and never include health values."}}, {"@type": "Question", "name": "How does Aera know what is normal for me?", "acceptedAnswer": {"@type": "Answer", "text": "It learns your usual range from your own nights and sessions over several weeks, then compares each new day with it. While your history is thin, it says it is still learning instead of guessing."}}, {"@type": "Question", "name": "Is Aera a medical device?", "acceptedAnswer": {"@type": "Answer", "text": "No. Aera is for everyday wellbeing and training. Watch measurements such as sleep stages are estimates, and every article says where its number stops being reliable."}}, {"@type": "Question", "name": "Which languages does Aera speak?", "acceptedAnswer": {"@type": "Answer", "text": "English, Hungarian, German, Spanish and French in full, and Italian, Japanese, Portuguese and Traditional Chinese in part."}}]}]}</script>

@font-face{font-family:AeraRounded;src:local("SF Pro Rounded")}
:root{--serif:-apple-system,"SF Pro Display",system-ui,sans-serif;--rounded:AeraRounded,ui-rounded,-apple-system,sans-serif;--text:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --smooth:cubic-bezier(.23,1,.32,1);--bounce:cubic-bezier(.34,1.56,.64,1)}
/* Values from AeraColors.swift, AeraPageTokens.swift, PageLand.swift, AeraUsualTracks.swift and the canvas film */
.day{--paper:#F6F4EF;--ink:rgba(0,0,0,.88);--ink2:rgba(0,0,0,.60);--ink3:rgba(0,0,0,.45);--hair:rgba(0,0,0,.10);
  --plate:rgba(255,255,255,.62);--track:rgba(0,0,0,.07);--band:rgba(128,180,158,.52);--bandEdge:rgba(128,180,158,.62);--pearl:rgba(0,0,0,.88);
  --fRec:#C8E7CB;--fSleep:#E2D9F5;--fAge:#F3DDD0;--recInk:#23773E;--sleepInk:#5D5AEA;--ageInk:#9A4214;--care:#9A6105;
  --sA:#E0820A;--sR:#1C93CF;--sL:#4F74E0;--sD:#6E52E8;--laneA:.16;--hub:#F3DDD0}
.night{--paper:#1C1C1E;--ink:rgba(255,255,255,.92);--ink2:rgba(255,255,255,.64);--ink3:rgba(255,255,255,.46);--hair:rgba(255,255,255,.12);
  --plate:rgba(255,255,255,.07);--track:rgba(255,255,255,.11);--band:#4F675F;--bandEdge:transparent;--pearl:#fff;
  --fRec:#1F3326;--fSleep:#2C2843;--fAge:#2E1D17;--recInk:#3CB464;--sleepInk:#8E8CF0;--ageInk:#EF8A55;--care:#F1B451;
  --sA:#EF951F;--sR:#64D2FF;--sL:#6D92EC;--sD:#8266F0;--laneA:.2;--hub:#3A2A24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141210;font-family:var(--text);display:flex;gap:76px;padding:56px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px}
.caption{color:rgba(255,255,255,.55);font-size:13px}.caption b{color:#F0B24A;font-weight:600}
.notes{color:rgba(255,255,255,.62);font-size:13px;line-height:1.55;max-width:640px}
.notes li{margin:0 0 6px 16px}.notes b{color:rgba(255,255,255,.9)}

.page{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden}
.desk{width:1280px}.phone{width:393px;border-radius:34px}
.wrap{padding:0 80px;position:relative}.phone .wrap{padding:0 20px}

/* ---- the opening: the film's settled frame fills the first screen; the nav floats on it; the words come after ---- */
.open{background:#000;color:#fff;position:relative;overflow:hidden}
/* the header: the page's own rooms, not a sitemap. Clear over the film; past it, dark glass that names the room you are in */
.page{overflow:clip}
.top{position:sticky;top:0;height:72px;margin-bottom:-72px;z-index:6;color:#fff;transition:background .35s var(--smooth),box-shadow .35s var(--smooth)}
.top:before{content:"";position:absolute;inset:0 0 -40px;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0));pointer-events:none;transition:opacity .35s}
.top.glass{background:rgba(14,14,16,.62);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
.top.glass:before{opacity:0}
.bar{display:flex;align-items:center;height:72px;position:relative;z-index:2}

.rooms a.on{background:rgba(255,255,255,.14);color:#fff}
.rooms [data-go=c-rec]{--hue:#3CB464}.rooms [data-go=c-sleep]{--hue:#8E8CF0}.rooms [data-go=c-run]{--hue:#F1641C}.rooms [data-go=c-age]{--hue:#EF8A55}
.dl{flex:1;display:flex;justify-content:flex-end}
.dl:before{content:"Download";font:600 17px var(--text);padding:10px 18px;border-radius:999px;background:#fff;color:#000}

.burger:before{content:"";width:15px;height:9px;border-top:2px solid #fff;border-bottom:2px solid #fff}
.phone .rooms{display:none}.phone .burger{display:grid}.phone .dl{flex:0}.phone .dl:before{content:"Get";padding:9px 16px}
/* the film: 16:9 on the desktop (the canvas film re-framed wide), the vertical cut on the phone; it plays once,
   muted, and holds on its last frame, the three pages; the words then rise out of its dark foot */
.world{position:relative;height:780px;overflow:hidden}.world video,.world img{top:60px!important}
.world video,.world img{position:absolute;left:0;top:0;width:100%;display:block}
.world:after{content:"";position:absolute;left:0;right:0;bottom:0;height:470px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7) 12%,rgba(0,0,0,.97) 28%,#000 36%);pointer-events:none}
.phone .world{height:763px}

.free{text-align:center;font-size:17px;color:rgba(255,255,255,.6);margin-top:16px;padding-bottom:110px}
.store,.open .play{height:54px;box-sizing:border-box;flex-shrink:0}
.phone .open .play{padding:13px 16px 13px 14px}.phone .open .play small{display:none}

.store i{font:normal 28px/1 -apple-system}
.store div{font:12px/1.1 var(--text)}.store b{display:block;font:600 20px/1.1 var(--text);letter-spacing:-.3px}
.play{cursor:pointer;display:flex;align-items:center;gap:11px;padding:13px 20px 13px 16px;border-radius:14px;background:rgba(255,255,255,.16);backdrop-filter:blur(16px);color:#fff;font:600 18px var(--text);white-space:nowrap}

.phone .open h1{font-size:48px;letter-spacing:-.015em;margin-top:-150px}
.phone .open .lede{font-size:20px;margin-top:16px;padding:0 6px}
.phone .open .cta{margin-top:24px}.phone .free{padding-bottom:72px}

/* ---- a chapter: the room's own colour edge to edge, one sentence, one instrument at full size ---- */
.ch{position:relative;background:var(--field);padding:120px 0 120px}
.phone .ch{padding:72px 0 64px}
.c-rec{--field:var(--fRec);--room:var(--recInk)}.c-sleep{--field:var(--fSleep);--room:var(--sleepInk)}

.k{font:600 19px var(--text);color:var(--room);display:flex;align-items:center;gap:9px;margin-bottom:22px}
.ic{width:30px;height:30px}
h2{font:700 64px/1.04 var(--serif);letter-spacing:-.015em}
.phone h2{font-size:36px;letter-spacing:-.015em}

.phone .lede{font-size:20px}

.phone .split{grid-template-columns:1fr;gap:40px}

/* Recovery: AeraUsualTracks at chapter size */
.rtracks{margin-top:64px}.phone .rtracks{margin-top:40px}
.day .c-rec{--track:rgba(255,255,255,.5);--band:rgba(88,150,122,.40);--bandEdge:rgba(88,150,122,.55)}
.night .c-rec{--track:rgba(255,255,255,.08)}
.rtracks{--th:340px;--tw:54px;--reach:26px;max-width:940px;margin-left:auto;margin-right:auto}.phone .rtracks{--th:250px;--tw:34px;--reach:16px}
.tracks{position:relative;height:var(--th);display:grid;grid-template-columns:repeat(3,1fr)}
.syms{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;margin-bottom:20px}.syms svg{width:38px;height:38px;display:block}.phone .syms svg{width:28px;height:28px}.phone .syms{margin-bottom:14px}
.tracks .band{position:absolute;top:calc(var(--th)/3);height:calc(var(--th)/3);left:calc(16.667% - var(--tw)/2 - var(--reach));right:calc(16.667% - var(--tw)/2 - var(--reach));border-radius:999px;background:var(--band);box-shadow:inset 0 0 0 1.5px var(--bandEdge)}
.tracks .t{position:relative;display:flex;justify-content:center}
.tracks .t i{width:var(--tw);height:var(--th);border-radius:999px;background:var(--track)}
.pearl{position:absolute;left:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--pearl);top:50%;box-shadow:0 0 0 4px var(--ring,transparent);
  transform:scale(0);transition:top .7s var(--bounce),transform .5s var(--bounce)}
.phone .pearl{width:16px;height:16px;margin:-8px 0 0 -8px;box-shadow:0 0 0 3px var(--ring,transparent)}
.pearl.u{--ring:#80B49E}.night .pearl.u{--ring:#80B49E}
.phone .toprow .read{margin-top:14px!important}
.labels em{display:block;font:600 19px var(--rounded);font-style:normal;color:var(--ink2);margin-top:8px}.labels em.q{visibility:hidden}.phone .labels em{font-size:17px;margin-top:4px}
.in .pearl{transform:none}
.labels{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:30px}
.labels span{display:block;font-size:19px;color:var(--ink2)}
.labels b{display:block;font:600 64px/1.05 var(--rounded);margin-top:6px;letter-spacing:-1.8px}.labels b small{font:600 24px var(--rounded);color:var(--ink2);margin-left:5px;letter-spacing:0}
.phone .labels{margin-top:20px}.phone .labels span{font-size:17px}.phone .labels b{font-size:36px;letter-spacing:-.8px}.phone .labels b small{font-size:17px;margin-left:3px}
.c-rec .toprow{display:block}.c-age .toprow{display:block}.c-age .toprow .line{max-width:440px;margin-top:22px}
.agesplit{display:grid;grid-template-columns:1fr 560px;gap:40px;align-items:center}.phone .agesplit{grid-template-columns:1fr}.c-rec .toprow .line{max-width:620px;margin-top:22px}

/* Sleep: the four-lane night, the page's full width */
.toprow{display:grid;grid-template-columns:1fr auto;gap:60px;align-items:end}
.toprow .line{max-width:400px;margin:0 0 6px}
.phone .toprow .line{margin-top:14px}
.phone .toprow{grid-template-columns:1fr;gap:6px}
.night4{margin-top:64px}.phone .night4{margin-top:40px}

.c-run .split{grid-template-columns:480px 1fr}

.map{overflow:hidden}.map .play{z-index:2}

.map .play{position:absolute;right:80px;bottom:44px}

.runfacts{display:flex;gap:44px;margin-top:34px}

.foot{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:40px 72px;margin-top:96px;padding:56px 0 40px;border-top:1px solid rgba(255,255,255,.12);text-align:left}

.fcol a{font-size:19px;color:rgba(255,255,255,.82);cursor:pointer}.fcol a:hover{color:#fff}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.seg a{font:600 17px var(--text);color:rgba(255,255,255,.66);padding:7px 13px;border-radius:999px;cursor:pointer}.seg a.on{background:rgba(255,255,255,.16);color:#fff}
.fmark .store{margin-top:24px;display:inline-flex}
.fbase{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,.08)}

.phone .foot{grid-template-columns:1fr 1fr;gap:32px 20px;margin-top:80px;padding-top:40px}

/* motion: each chapter arrives as it scrolls in (fade + slide, beats of 60 ms); lines draw; pearls land with one bounce */
.a{opacity:0;transform:translateY(16px);transition:opacity .7s var(--smooth),transform .7s var(--smooth);transition-delay:calc(var(--b,0)*60ms)}
.in .a{opacity:1;transform:none}
.still *{transition:none!important;animation:none!important}

/* ---- light and dark: every page follows the viewer's setting (a #still-light / #still-dark render forces one) ---- */
.day{--runInk:#B8541E;--trendInk:#23773E}.night{--runInk:#F1641C;--trendInk:#3CB464}
/* the header over paper (light mode on pages that open on paper) */
.day .top.lt{color:rgba(0,0,0,.88)}
.day .top.lt:before{opacity:0}
.day .top.lt .rooms{background:rgba(0,0,0,.045);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.day .top.lt .rooms a{color:rgba(0,0,0,.7)}.day .top.lt .rooms a:hover{color:rgba(0,0,0,.88)}
.day .top.lt .rooms a.on{background:rgba(0,0,0,.075);color:rgba(0,0,0,.88)}
.day .top.lt .dl:before{background:#1C1C1E;color:#fff}
.day .top.lt .burger{background:rgba(0,0,0,.06)}
.day .top.lt.glass{background:rgba(246,244,239,.76);box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
/* the phone menu: the burger opens the site's pages under the bar */
.burger{border:0;position:relative;cursor:pointer;color:inherit}
.burger:before,.burger:after{content:"";position:absolute;left:12px;width:16px;height:2px;border:0;border-radius:1px;background:currentColor;transition:transform .3s var(--smooth),top .3s var(--smooth)}
.burger:before{top:15px}.burger:after{top:23px}
.phone .burger{display:block}
.top.menu-on .burger:before{top:19px;transform:rotate(45deg)}.top.menu-on .burger:after{top:19px;transform:rotate(-45deg)}
.menu{display:none}
/* the open menu is a solid sheet down to the bottom of the screen: nothing shows through */
.top.menu-on{background:#141416;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}.top.menu-on:before{opacity:0}
.top.menu-on .menu{display:block;position:absolute;left:0;right:0;top:72px;min-height:calc(100vh - 72px);padding:4px 20px 30px;background:#141416}
.menu a{display:block;font:600 30px/1.2 var(--serif);letter-spacing:-.01em;padding:13px 0;color:rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer}

.day .top.lt.menu-on,.day .top.lt.menu-on .menu{background:#F6F4EF}
.day .top.lt .menu a{color:rgba(0,0,0,.52);border-color:rgba(0,0,0,.09)}.day .top.lt .menu p a{color:rgba(0,0,0,.52)}.day .top.lt .menu a.on{color:rgba(0,0,0,.9)}
.rooms.site a{padding:8px 14px}.still .burger:before,.still .burger:after{transition:none}

/* ---- type pass: the app's own faces, nothing small ---- */

/* ---- the live page: one layout by width (phone under 760 px), grounds full width, words in a column ---- */
html{background:#000}body{display:block;margin:0;padding:0;gap:0;background:#000;-webkit-text-size-adjust:100%}
.page,.page.desk,.page.phone{width:auto;border-radius:0;overflow:clip;min-height:100vh}
.desk .wrap{max-width:1440px;margin-left:auto;margin-right:auto;box-sizing:border-box}
.top.menu-on .menu{min-height:calc(100dvh - 72px)}
:where(.page a[href]){color:inherit;text-decoration:none}

.page .credit{font-size:17px}
.rooms a{white-space:nowrap}.mid .top .wrap{padding:0 32px}.mid .rooms a{padding:8px 12px}

/* ---- on aerahealth.app: a jump to an anchor clears the header; the languages sit at the foot ---- */
[id]{scroll-margin-top:96px}
.fbase .flangs{flex-direction:row;gap:24px;margin-left:auto}.phone .fbase .flangs{margin-left:0}

/* ---- round 4: balanced headlines, one sentence per closing line, tablet footer and stacks ---- */

.mid .toprow{grid-template-columns:1fr;gap:20px;align-items:start}

.c-map .split{grid-template-columns:440px 1fr;gap:64px}

.phone .loop .rc{stroke-width:9px}.phone .loop .rt{stroke-width:4.5px}
.sg,.st{position:absolute;width:0;height:0}

.sg i{position:absolute;top:-.62em;font:600 19px/1.2 var(--text);font-style:normal;color:var(--ink);white-space:nowrap}

.phone .sg i{font-size:17px}

/* the night (the film's press seed): 6 h 37 m asleep in 402 min, from 23:18 to 06:00 */
const NIGHT = [['L',12],['D',28],['L',22],['R',14],['L',30],['D',22],['L',26],['R',22],['A',2],['L',30],['D',12],

/* an orthogonal polyline with its corners rounded */
function roundD(pts, r) {

function drawNight(svg) {

  defs.append(g);
  lanes.forEach(([k, name, val, c], i) => {
    const r = el('rect', {x: L, y: Y[k] - bh / 2, width: W - L, height: bh, rx: bh / 2, style: `fill:${c};fill-opacity:var(--laneA)`}); svg.append(r);

}

  const vbw = ph ? 396 : 460, k = vbw / (svg.getBoundingClientRect().width || vbw), small = k > 1;

  defs.append(hl); svg.append(defs);

    const d = `M${x0},${y0} L${x1},${y1} A${r1},${r1} 0 0 1 ${x2},${y2} L${x3},${y3} A${rin},${rin} 0 0 0 ${x0},${y0}Z`;
    const g = el('g', {class: 'petal'});
    /* masks, so a translucent paint never doubles where a rounding stroke overlaps its fill */
    const mk = (sw) => { const m = el('mask', {id: `m${id}${i}${sw}`, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 460, height: 460});
      m.append(el('path', {d, fill: '#fff', stroke: '#fff', 'stroke-width': sw, 'stroke-linejoin': 'round'})); defs.append(m); return `url(#m${id}${i}${sw})`; };
    const xs = [x0, x1, x2, x3, pt(r1, mid)[0]], ys = [y0, y1, y2, y3, pt(r1, mid)[1]];

    g.append(fillRect('#fff', mk(28), night ? .2 : .85));
    g.append(fillRect(col, mk(25), night ? .82 : .74));

    { const [tx, ty] = pt(r0 + len * (label ? .6 : .58), mid), gs = 26 * Math.min(k, 1.15), fs = (small ? 17 : 19) * k;
      const gy = label ? ty - gs - 2 : ty - gs / 2;

function arrive(room) {

  { const top = page.querySelector('.top'), cur = page.querySelector('.rooms a.on');
    if (cur) page.querySelectorAll('.menu a').forEach(a => a.classList.toggle('on', a.textContent === cur.textContent));
    const b = page.querySelector('.burger'); if (b) b.onclick = () => b.setAttribute('aria-expanded', String(top.classList.toggle('menu-on'))); }
  const ph = page.classList.contains('phone');
  { const v = page.querySelector('[data-film]'), [src, poster] = ph ? FILM.phone : FILM.desk;
    if (still) { const i = new Image(); i.src = poster; v.replaceWith(i); }
    else { v.poster = poster; v.src = src; v.play().catch(() => {});
      page.querySelector('.open .play').onclick = () => { v.currentTime = 0; v.play(); v.scrollIntoView({behavior: 'smooth'}); }; } }

    const th = p.parentNode.clientHeight, z = +p.dataset.z;

  page.querySelectorAll('[data-night]').forEach(drawNight);
  page.querySelectorAll('[data-wheel]').forEach(drawWheel);
  page.querySelectorAll('.rooms a[data-go]').forEach(a => { const ch = page.querySelector('.' + a.dataset.go);
    const ic = ch.querySelector('.k svg'); if (ic) { const c = ic.cloneNode(true); a.prepend(c);
      if (a.dataset.go === 'c-age') c.querySelectorAll('ellipse').forEach((e, i) => e.setAttribute('fill', ['#EF7A3C', '#F0BE45', '#8F8FE6', '#F25B83', '#6C66E6', '#8C8A88'][i])); }
    a.onclick = () => ch.scrollIntoView({behavior: 'smooth'}); });
  if (!still) { const top = page.querySelector('.top'), film = page.querySelector('.open'), links = page.querySelectorAll('.rooms a[data-go]');
    const tick = () => { const y = top.getBoundingClientRect().bottom;
      const hl = film.querySelector('h1'); top.classList.toggle('glass', hl ? hl.getBoundingClientRect().top < y + 12 : film.getBoundingClientRect().bottom < y + 40);
      links.forEach(a => { const r = page.querySelector('.' + a.dataset.go).getBoundingClientRect(); a.classList.toggle('on', r.top <= y + 1 && r.bottom > y + 1); }); };

  rooms.forEach(r => io.observe(r));
});
