@font-face{font-family:AeraRounded;src:local("SF Pro Rounded")}

  --fRec:#1F3326;--fSleep:#2C2843;--fAge:#3A2A24;--recInk:#3CB464;--sleepInk:#8E8CF0;--ageInk:#EF8A55;--care:#F1B451;
  --sA:#EF951F;--sR:#64D2FF;--sL:#6D92EC;--sD:#8266F0;--laneA:.2;--hub:#3A2A24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141210;font-family:var(--text);display:flex;gap:76px;padding:56px;align-items:flex-start}

.page{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden}
.desk{width:1280px}.phone{width:393px;border-radius:34px}
.wrap{padding:0 80px;position:relative}.phone .wrap{padding:0 20px}

/* ---- the opening: the film's settled frame fills the first screen; the nav floats on it; the words come after ---- */
.open{background:#000;color:#fff;position:relative;overflow:hidden}
/* the header: the page's own rooms, not a sitemap. Clear over the film; past it, dark glass that names the room you are in */

.top.glass{background:rgba(14,14,16,.62);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
.top.glass:before{opacity:0}
.bar{display:flex;align-items:center;height:72px;position:relative;z-index:2}

.rooms [data-go=c-rec]{--hue:#3CB464}.rooms [data-go=c-sleep]{--hue:#8E8CF0}.rooms [data-go=c-run]{--hue:#F1641C}.rooms [data-go=c-age]{--hue:#EF8A55}
.dl{flex:1;display:flex;justify-content:flex-end}
.dl:before{content:"Download";font:600 17px var(--text);padding:10px 18px;border-radius:999px;background:#fff;color:#000}

.phone .rooms{display:none}.phone .burger{display:grid}.phone .dl{flex:0}.phone .dl:before{content:"Get";padding:9px 16px}
/* the film: 16:9 on the desktop (the canvas film re-framed wide), the vertical cut on the phone; it plays once,
   muted, and holds on its last frame, the three pages; the words then rise out of its dark foot */
.world{position:relative;height:780px;overflow:hidden}.world video,.world img{top:60px!important}

.phone .world{height:763px}

.day .c-rec{--track:rgba(255,255,255,.5);--band:rgba(88,150,122,.40);--bandEdge:rgba(88,150,122,.55)}
.night .c-rec{--track:rgba(255,255,255,.08)}
.rtracks{--th:340px;--tw:54px;--reach:26px;max-width:940px;margin-left:auto;margin-right:auto}.phone .rtracks{--th:250px;--tw:34px;--reach:16px}
.tracks{position:relative;height:var(--th);display:grid;grid-template-columns:repeat(3,1fr)}
.syms{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;margin-bottom:20px}.syms svg{width:38px;height:38px;display:block}.phone .syms svg{width:28px;height:28px}.phone .syms{margin-bottom:14px}
.tracks .band{position:absolute;top:calc(var(--th)/3);height:calc(var(--th)/3);left:calc(16.667% - var(--tw)/2 - var(--reach));right:calc(16.667% - var(--tw)/2 - var(--reach));border-radius:999px;background:var(--band);box-shadow:inset 0 0 0 1.5px var(--bandEdge)}

  transform:scale(0);transition:top .7s var(--bounce),transform .5s var(--bounce)}
.phone .pearl{width:16px;height:16px;margin:-8px 0 0 -8px;box-shadow:0 0 0 3px var(--ring,transparent)}
.pearl.u{--ring:#80B49E}.night .pearl.u{--ring:#80B49E}
.phone .toprow .read{margin-top:14px!important}
.labels em{display:block;font:600 19px var(--rounded);font-style:normal;color:var(--ink2);margin-top:8px}.labels em.q{visibility:hidden}.phone .labels em{font-size:17px;margin-top:4px}
.in .pearl{transform:none}
.labels{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:30px}
.labels span{display:block;font-size:19px;color:var(--ink2)}
.labels b{display:block;font:600 64px/1.05 var(--rounded);margin-top:6px;letter-spacing:-1.8px}.labels b small{font:600 24px var(--rounded);color:var(--ink2);margin-left:5px;letter-spacing:0}
.phone .labels{margin-top:20px}.phone .labels span{font-size:17px}.phone .labels b{font-size:36px;letter-spacing:-.8px}.phone .labels b small{font-size:17px;margin-left:3px}
.c-rec .toprow{display:block}.c-age .toprow{display:block}.c-age .toprow .line{max-width:440px;margin-top:22px}

/* Sleep: the four-lane night, the page's full width */
.toprow{display:grid;grid-template-columns:1fr auto;gap:60px;align-items:end}

.c-run{min-height:760px;overflow:hidden}
.map{position:absolute;right:0;top:0;bottom:0;width:60%;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.55) 14%,#000 30%);mask-image:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.55) 14%,#000 30%)}
.phone .map{-webkit-mask-image:none;mask-image:none}
.phone .map{position:relative;width:auto;height:500px;margin:0}
.c-run .split{grid-template-columns:480px 1fr}
.phone .c-run .split{grid-template-columns:1fr}.phone .c-run{padding-bottom:0}
.map{overflow:hidden}.map .play{z-index:2}

.phone .map{height:560px}.phone .map img{object-position:50% 100%;-webkit-mask-image:linear-gradient(rgba(0,0,0,0),#000 90px);mask-image:linear-gradient(rgba(0,0,0,0),#000 90px)}.phone .map .credit{bottom:28px;right:20px}
.c-run .line{max-width:400px}
.map .play{position:absolute;right:80px;bottom:44px}
.phone .map .play{right:auto;left:20px;bottom:24px}.phone .map{height:600px}
.runfacts{display:flex;gap:44px;margin-top:34px}

.runfacts b{display:block;font:700 64px/1.05 var(--rounded);letter-spacing:-2px;margin-top:6px}.runfacts b small{font:600 24px var(--rounded);color:var(--ink2);margin-left:3px;letter-spacing:0}

.phone .runfacts{flex-direction:column;gap:20px}.phone .runfacts b{font-size:40px;letter-spacing:-1.2px}.phone .runfacts b small{font-size:19px}.phone .runfacts em{font-size:17px}

/* close: back to black */

.fcol,.flang{display:flex;flex-direction:column;gap:12px}
.fcol b,.flang b{font:600 17px var(--text);color:rgba(255,255,255,.46);margin-bottom:4px}
.fcol a{font-size:19px;color:rgba(255,255,255,.82);cursor:pointer}.fcol a:hover{color:#fff}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.seg a{font:600 17px var(--text);color:rgba(255,255,255,.66);padding:7px 13px;border-radius:999px;cursor:pointer}.seg a.on{background:rgba(255,255,255,.16);color:#fff}

.phone .fbase{flex-direction:column-reverse;align-items:flex-start}
.phone .foot{grid-template-columns:1fr 1fr;gap:32px 20px;margin-top:80px;padding-top:40px}
.phone .fmark{grid-column:1/-1}

/* motion: each chapter arrives as it scrolls in (fade + slide, beats of 60 ms); lines draw; pearls land with one bounce */
.a{opacity:0;transform:translateY(16px);transition:opacity .7s var(--smooth),transform .7s var(--smooth);transition-delay:calc(var(--b,0)*60ms)}
.in .a{opacity:1;transform:none}
.still *{transition:none!important;animation:none!important}

/* Replay page */
.rooms.site a{padding:8px 14px}.still .burger:before,.still .burger:after{transition:none}
.c-run .split{min-height:520px}.phone .c-run .split{min-height:0}

.rpgrid{position:relative;display:grid;grid-template-columns:1fr 430px;gap:72px;align-items:center}

.frame .scrub{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.18);z-index:2}

.c-facts{--field:#F3EFE9;--ink:#1C1A17;--ink2:rgba(28,26,23,.66);color:var(--ink)}

 <section class="rdopen" data-room><div class="wrap"><div class="k a">Privacy policy · November 2026</div><h1 class="a long" style="--b:1">Your health data never leaves your&nbsp;phone.</h1><p class="lede a" style="--b:2">Aera works everything out on your iPhone. There is no Aera account, and Aera&#8217;s own servers never see your health data. This policy covers what does leave, and&nbsp;why.</p></div></section><section class="rd"><div class="wrap"><div class="sec" data-room><h2 class="a">In short</h2><div class="body a" style="--b:1"><div class="sum"><p><b>Health data stays here</b><span>Read from Apple Health and worked out on this phone. Never sent.</span></p><p><b>Usage counts, if you say yes</b><span>Which screens you open and what you tap, under a random code.</span></p><p><b>Crash reports</b><span>Sent when something fails, so it gets fixed. No health data.</span></p><p><b>Maps see an area, not you</b><span>Map services get the place you look at, never your name.</span></p><p><b>Purchases go through Apple</b><span>Aera never sees your card or your Apple ID.</span></p><p><b>Your rights</b><span>See, erase or object at any time. Just write.</span></p></div></div></div><div class="sec" data-room><h2 id="who" class="a">Who is responsible</h2><div class="body a" style="--b:1"><p>Aera is made by Gergo Varga, 8000 Székesfehérvár, Nagyszombati utca 156., Hungary, who is responsible for your data (&#8220;we&#8221;). Write to <a href="mailto:Aerahealthapp@gmail.com">Aerahealthapp@gmail.com</a>, or use Contact in Settings.</p></div></div><div class="sec" data-room><h2 id="stays" class="a">What stays on your iPhone</h2><div class="body a" style="--b:1"><p>Your health values, scores, workouts, sleep, notes and your name. Aera reads Apple Health only with your permission, which you can change any time in iOS Settings › Privacy &amp; Security › Health. We never receive any of it.</p></div></div><div class="sec" data-room><h2 id="leaves" class="a">What leaves, and where</h2><div class="body a" style="--b:1"><ul>
    <li><strong>Usage counts</strong> go to Mixpanel in the EU, only if you say yes. In the UK and Switzerland they start on, with a notice, until you turn them off.</li>
    <li><strong>Crash reports</strong> go to Sentry in the EU.</li>
    <li><strong>Map lookups</strong> go to Apple Maps, OpenStreetMap servers, OpenFreeMap, Wikipedia and Amazon Web Services.</li>
    <li><strong>Workout weather</strong> is looked up with Apple Weather.</li>
    <li><strong>Names you give places</strong> go to your own iCloud.</li>
    <li><strong>Linked devices</strong>, like Oura or Polar, send your data to this phone, only if you link them.</li>
    <li><strong>Purchases</strong> go through Apple.</li>
  </ul></div></div><div class="sec" data-room><h2 id="analytics" class="a">Usage counts</h2><div class="body a" style="--b:1"><p><strong>Off until you say yes</strong> in the EU, the US, Canada, Australia and most other countries. In the UK and Switzerland they start on, with a notice. Turn them off any time in Settings › Privacy. If what Aera counts grows, it asks you again.</p>
  <p>What is sent:</p>
  <ul>
    <li>which screens you open and what you tap</li>
    <li>which settings you change, never their values</li>
    <li>how far setup got and how fast the app opens</li>
    <li>how you found Aera, if you answer that question in setup</li>
    <li>how bigger steps ended, like saving a route or an import</li>
    <li>app version, device model, iOS version, region setting, Premium status and a random install code</li>
  </ul>
  <p>Every value is a fixed word or a rounded number. Never health data, scores, routes, names, anything you type, your email or an advertising ID. Mixpanel is told not to use your IP address for location. Turning counts off deletes anything not yet sent and retires the code.</p>
  <p>Earlier versions also sent rough score bands and feedback categories. Those records stay until they expire or you ask us to erase them.</p>
  <p class="basis">Legal basis: your consent; in the UK and Switzerland, our legitimate interest in improving Aera. Kept for up to 24 months.</p></div></div><div class="sec" data-room><h2 id="crash" class="a">Crash reports</h2><div class="body a" style="--b:1"><p>When Aera crashes, freezes or a step fails, it sends Sentry a report: what failed, app and iOS version, device model, language and region settings, memory and battery state, the last steps in the app, and a random crash code. Never screenshots, screen content, your name, health data or GPS. Turn them off any time in Settings › Privacy.</p>
  <p class="basis">Legal basis: our legitimate interest in an app that works. Kept for up to 90 days.</p></div></div><div class="sec" data-room><h2 id="maps" class="a">Maps and places</h2><div class="body a" style="--b:1"><p>To draw maps, name places and fetch weather, Aera sends the coordinates of the place involved: the area you look at, or where a workout happened. Never your name, health data or a code that identifies you.</p>
  <p>Like any website, these services see your IP address. Some, such as Apple and Wikimedia, are in the US. The names you give places and routes are backed up to your own iCloud with a simplified outline, so reinstalling keeps them. Turn off iCloud for Aera to stop this.</p>
  <p class="basis">Legal basis: providing the features you use.</p></div></div><div class="sec" data-room><h2 id="devices" class="a">Linked devices</h2><div class="body a" style="--b:1"><p>If you link a device account, like Oura or Polar, you sign in on the maker&#8217;s own page. Aera&#8217;s small sign-in helper at Cloudflare swaps that sign-in for a key and hands it to this phone. It never sees your health data, and Aera logs and keeps nothing there. Aera then downloads your data straight to this phone. Nothing is sent back. The key stays in this phone&#8217;s keychain, and unlinking deletes it. The device maker&#8217;s own policy covers your account with them.</p></div></div><div class="sec" data-room><h2 id="purchases" class="a">Purchases</h2><div class="body a" style="--b:1"><p>Apple takes the payment. Aera only learns which plan is active, never your card, name or Apple ID. When paid plans return, Apple will also report each purchase to RevenueCat (US), our subscription service: plan, price, country, dates and a random purchase code.</p>
  <p class="basis">Legal basis: your purchase. Kept while your subscription runs and as long as accounting law requires.</p></div></div><div class="sec" data-room><h2 id="ads" class="a">No ads, no tracking</h2><div class="body a" style="--b:1"><p>We don&#8217;t sell data, show ads or track you across apps and websites.</p></div></div><div class="sec" data-room><h2 id="rights" class="a">Your rights</h2><div class="body a" style="--b:1"><p>You can ask to see, correct, erase or download your data, limit its use, or object to it. You can withdraw consent any time, which doesn&#8217;t affect what was sent before. Write to us. Contact in Settings adds your random codes, so we can find your records. We reply within a month.</p>
  <p>Delete all data in Settings › Privacy erases what Aera keeps on this phone, except its random codes, which stay so your records can still be found. Apple Health stays untouched.</p>
  <p>You can also complain to a data protection authority: in Hungary the NAIH (naih.hu), or the one where you live.</p></div></div><div class="sec" data-room><h2 id="children" class="a">Children</h2><div class="body a" style="--b:1"><p>Aera is rated 9+. If you are under 16, ask a parent before saying yes to usage counts.</p></div></div><div class="sec" data-room><h2 id="website" class="a">This website</h2><div class="body a" style="--b:1"><p>aerahealth.app counts visits with Cloudflare Web Analytics, which sets no cookies, stores nothing on your device and does not track you across sites; it records the page you opened, the page that sent you, your browser type and your country.</p>
  <h3 id="planner">The route planner</h3>
  <p>The route planner at aerahealth.app/plan works inside your browser. The points you place and the route it finds are never sent to Aera.</p>
  <p>The map and the paths come from OpenFreeMap, a free map service built on OpenStreetMap data. Your browser downloads map tiles straight from OpenFreeMap, which receives your IP address and the areas of the map you load, as any website you visit does.</p>
  <p>When you send a route to your iPhone, the QR code holds a link with your points written after the # sign. Browsers don&#8217;t send that part when they open the page, so it never reaches Aera or OpenFreeMap. If you download a GPX file, your browser saves it on your computer.</p>
  <p>If you press the locate button, your browser asks before sharing your location, and the planner uses it only to move the map. This page has no Cloudflare visit counter, because that counter reads the whole address, including the part after the #.</p></div></div><div class="sec" data-room><h2 id="changes" class="a">Changes</h2><div class="body a" style="--b:1"><p>When this policy changes, the new version shows here with its date. Where your consent is needed, Aera asks again.</p></div></div><p class="meta">Last updated November 2026</p></div></section>

<script>
const PH0 = innerWidth < 760, MID0 = !PH0 && innerWidth < 1100;
document.querySelectorAll('[data-page]').forEach(p => { p.classList.add(PH0 ? 'phone' : 'desk'); if (MID0) p.classList.add('mid'); });
addEventListener('resize', () => { const w = innerWidth; if ((w < 760) !== PH0 || (w >= 760 && w < 1100) !== MID0) location.reload(); });

const H = location.hash, still = H.startsWith('#still');
const themeNow = () => /dark/.test(H) ? 'night' : /light/.test(H) ? 'day'
  : (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark' ? 'night' : 'day';
document.querySelectorAll('[data-page]').forEach(p => { p.classList.remove('day', 'night'); p.classList.add(themeNow()); });
/* drawings read the theme when drawn, so a change of setting redraws the page */
const reTheme = () => { if (!document.querySelector('[data-page].' + themeNow())) location.reload(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme);
new MutationObserver(reTheme).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
const FILM = {desk: ['', ''], phone: ['', '']};

/* the night (the film's press seed): 6 h 37 m asleep in 402 min, from 23:18 to 06:00 */
const NIGHT = [['L',12],['D',28],['L',22],['R',14],['L',30],['D',22],['L',26],['R',22],['A',2],['L',30],['D',12],
  ['L',28],['R',30],['L',34],['D',7],['L',20],['R',24],['A',3],['L',16],['R',20]];
const MIN = 402;

/* an orthogonal polyline with its corners rounded */
function roundD(pts, r) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i], [cx, cy] = pts[i + 1];
    const l1 = Math.hypot(bx - ax, by - ay), l2 = Math.hypot(cx - bx, cy - by), k = Math.min(r, l1 / 2, l2 / 2);
    d += ` L${bx - (bx - ax) / l1 * k},${by - (by - ay) / l1 * k} Q${bx},${by} ${bx + (cx - bx) / l2 * k},${by + (cy - by) / l2 * k}`;
  }
  const z = pts.at(-1); return d + ` L${z[0]},${z[1]}`;
}

function drawNight(svg) {
  const W = svg.parentNode.clientWidth, ph = W < 500;
  const L = ph ? 0 : 170, top = ph ? 0 : 0, pitch = ph ? 62 : 88, bh = ph ? 44 : 64, H = top + pitch * 4 + 36;
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const x0 = L + (ph ? 8 : 20), x1 = W - (ph ? 8 : 20), xm = m => x0 + m / MIN * (x1 - x0);
  const lanes = [['A', 'Awake', '5 min', 'var(--sA)'], ['R', 'REM', '1 h 50 m', 'var(--sR)'], ['L', 'Light', '3 h 38 m', 'var(--sL)'], ['D', 'Deep', '1 h 09 m', 'var(--sD)']];
  const Y = {}; lanes.forEach(([k], i) => Y[k] = top + i * pitch + bh / 2);
  const defs = el('defs', {}); svg.append(defs);
  const g = el('linearGradient', {id: 'ng' + (ph ? 'p' : 'd'), gradientUnits: 'userSpaceOnUse', x1: 0, y1: Y.R, x2: 0, y2: Y.D});
  [[0, 'var(--sR)'], [.5, 'var(--sL)'], [1, 'var(--sD)']].forEach(([o, c]) => g.append(el('stop', {offset: o, style: `stop-color:${c}`})));
  defs.append(g);
  lanes.forEach(([k, name, val, c], i) => {
    const r = el('rect', {x: L, y: Y[k] - bh / 2, width: W - L, height: bh, rx: bh / 2, style: `fill:${c};fill-opacity:var(--laneA)`}); svg.append(r);
    if (ph) {
      const t = el('text', {x: L + 16, y: Y[k] + 5, 'font-size': 17, 'font-weight': 600, style: `fill:${c}`}); t.textContent = name;
      svg.append(t);
    } else {
      const t = el('text', {x: 0, y: Y[k] - 3, 'font-size': 17, style: 'fill:var(--ink2)'}); t.textContent = name;
      const v = el('text', {x: 0, y: Y[k] + 22, 'font-size': 22, 'font-weight': 700, style: 'fill:var(--ink);font-family:var(--rounded)'}); v.textContent = val;
      svg.append(t, v);
    }
  });
  /* the line: awake moments stay on the REM lane and drop a dot on the Awake lane, as in the app */
  const pts = []; let m = 0; const wake = [];
  const lx0 = ph ? L + 70 : x0;
  const xmm = mm => lx0 + mm / MIN * (x1 - lx0);
  for (const [s, d] of NIGHT) {
    if (s === 'A') wake.push(xmm(m + d / 2));
    const y = Y[s === 'A' ? 'R' : s];
    if (pts.length && pts.at(-1)[1] === y) pts.at(-1)[0] = xmm(m + d);
    else { if (pts.length) pts.push([xmm(m), pts.at(-1)[1]]); pts.push([xmm(m), y], [xmm(m + d), y]); }
    m += d;
  }
  const clean = pts.filter((p, i) => i === 0 || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
  const line = el('path', {d: roundD(clean, ph ? 8 : 12), fill: 'none', stroke: `url(#ng${ph ? 'p' : 'd'})`, 'stroke-width': ph ? 5 : 7, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', pathLength: 1, class: 'sl'});
  line.style.strokeDasharray = 1; line.style.strokeDashoffset = 1; line.style.transition = 'stroke-dashoffset 1.6s cubic-bezier(.23,1,.32,1) .4s';
  svg.append(line);
  wake.forEach((x, i) => { const c = el('circle', {cx: x, cy: Y.A, r: ph ? 7 : 10, class: 'dot', style: 'fill:var(--sA)'});
    c.style.opacity = 0; c.style.transition = `opacity .4s ${1.6 + i * .15}s`; svg.append(c); });
  [['23:18', 0], ['01:00', 102], ['03:00', 222], ['06:00', 402]].forEach(([t, mm], i) => {
    const s = el('text', {x: xmm(mm), y: H - 4, 'text-anchor': i === 0 ? 'start' : i === 3 ? 'end' : 'middle', 'font-size': 17, 'font-weight': i === 3 ? 600 : 400, style: `fill:${i === 3 ? 'var(--ink)' : 'var(--ink3)'}`}); s.textContent = t; svg.append(s); });
}

/* the run: OpenStreetMap outlines from the run film (run-map.json), framed on the loop */

/* Longevity wheel, the approved form: six rounded petals of glass tinted in their own hue, a hairline apart,
   a clear glass disc inside their feet; each petal's length is its reading */
function drawWheel(svg) {
  const C = 230, r0 = 86, P = [
    ['#EF7A3C', 124, '1 year 5 months', '#fff', 'fit'], ['#F0BE45', 104, '4 months', 'rgba(0,0,0,.78)', 'flame'], ['#8F8FE6', 58, '', 'rgba(0,0,0,.7)', 'lift'],
    ['#F25B83', 92, '2 months', '#fff', 'heart'], ['#6C66E6', 92, '2 months', '#fff', 'sleep'], ['#8C8A88', 58, '', '#fff', 'walk']];
  /* the app's petal symbols, drawn on a 24 grid */
  const GLYPH = {
    heart: '<path d="M12 21s-7.6-4.6-10-9.4C.4 8.3 2.4 4.2 6.1 4.2c2.2 0 3.6 1.2 4.5 2.5.7.9 1.2.9 1.9 0 .9-1.3 2.3-2.5 4.5-2.5 3.7 0 5.7 4.1 4.1 7.4C19.6 16.4 12 21 12 21z"/>',
    fit: '<path d="M12 21s-7.6-4.6-10-9.4C.4 8.3 2.4 4.2 6.1 4.2c2.2 0 3.6 1.2 4.5 2.5.7.9 1.2.9 1.9 0 .9-1.3 2.3-2.5 4.5-2.5 3.7 0 5.7 4.1 4.1 7.4C19.6 16.4 12 21 12 21z"/><path d="M13.2 7.5l-4 5.6h3l-1.4 4.6 4.2-6h-3z" fill="var(--pc)"/>',
    flame: '<path d="M12 2.5c.6 3.3 5.8 5.6 5.8 11a5.8 5.8 0 0 1-11.6 0c0-2.6 1.3-4.4 2.6-5.6.2 1.8 1 3 2.2 3.5C10.4 8.7 11 5.3 12 2.5z"/>',
    sleep: '<path d="M17.5 15.6A7.8 7.8 0 0 1 7.4 5.5a7.8 7.8 0 1 0 10.1 10.1z"/><path d="M14.5 3.2h4l-4 4.4h4M19.6 8.6h2.6l-2.6 3h2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
    walk: '<circle cx="13.2" cy="3.6" r="2"/><path d="M11.6 7.2l-3.2 2.4-.9 3.6M11.6 7.2l1.8 5.2 3 2M11.6 7.2l-1 6.3-2.6 6.8M10.8 13.6l3 2.6.9 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    lift: '<circle cx="12" cy="7" r="2"/><path d="M3 4.5v5M5.5 3.5v7M18.5 3.5v7M21 4.5v5M5.5 7h13M9 9.5l3 2.5 3-2.5M12 12v4.5M12 16.5l-3 4M12 16.5l3 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'};
  const pt = (r, a) => [C + r * Math.cos(a * Math.PI / 180), C + r * Math.sin(a * Math.PI / 180)];
  const night = !!svg.closest('.night'), id = night ? 'n' : 'd';
  /* type at the page's own sizes whatever width the wheel is drawn at: 17/15 labels, 64/40 figure */
  const k = 460 / (svg.getBoundingClientRect().width || 460), small = k > 1;
  const defs = el('defs', {});
  const hl = el('linearGradient', {id: 'hl' + id, x1: 0, y1: 0, x2: .3, y2: 1});
  [[0, .55], [.45, .12], [1, 0]].forEach(([o, a]) => hl.append(el('stop', {offset: o, 'stop-color': '#fff', 'stop-opacity': a})));
  defs.append(hl); svg.append(defs);
  P.forEach(([col, len, label, ink, sym], i) => {
    const mid = -90 + i * 60, a0 = mid - 20, a1 = mid + 20, r1 = r0 + len, rin = r0 + 14;
    const [x0, y0] = pt(rin, a0), [x1, y1] = pt(r1, a0), [x2, y2] = pt(r1, a1), [x3, y3] = pt(rin, a1);
    const d = `M${x0},${y0} L${x1},${y1} A${r1},${r1} 0 0 1 ${x2},${y2} L${x3},${y3} A${rin},${rin} 0 0 0 ${x0},${y0}Z`;
    const g = el('g', {class: 'petal'});
    /* masks, so a translucent paint never doubles where a rounding stroke overlaps its fill */
    const mk = (sw) => { const m = el('mask', {id: `m${id}${i}${sw}`, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 460, height: 460});
      m.append(el('path', {d, fill: '#fff', stroke: '#fff', 'stroke-width': sw, 'stroke-linejoin': 'round'})); defs.append(m); return `url(#m${id}${i}${sw})`; };
    const xs = [x0, x1, x2, x3, pt(r1, mid)[0]], ys = [y0, y1, y2, y3, pt(r1, mid)[1]];
    const bx = Math.min(...xs) - 16, by = Math.min(...ys) - 16, bw = Math.max(...xs) - bx + 16, bh = Math.max(...ys) - by + 16;
    const fillRect = (fill, mask, op) => el('rect', {x: bx, y: by, width: bw, height: bh, fill, mask, opacity: op});
    g.append(fillRect('#fff', mk(28), night ? .2 : .85));
    g.append(fillRect(col, mk(25), night ? .82 : .74));
    g.append(fillRect(`url(#hl${id})`, mk(25), 1));
    { const [tx, ty] = pt(r0 + len * (label ? .6 : .58), mid), gs = 26 * Math.min(k, 1.15), fs = (small ? 15 : 17) * k;
      const gy = label ? ty - gs - 2 : ty - gs / 2;
      const ic = el('g', {transform: `translate(${tx - gs / 2},${gy}) scale(${gs / 24})`, fill: ink, color: ink, style: `--pc:${col}`}); ic.innerHTML = GLYPH[sym]; g.append(ic);
      if (label) { const t = el('text', {x: tx, y: ty + fs * .75, 'text-anchor': 'middle', fill: ink, 'font-size': fs, 'font-weight': 600}); t.textContent = label; g.append(t); } }
    g.style.transformBox = 'view-box'; g.style.transformOrigin = '230px 230px';
    g.style.opacity = 0; g.style.transform = 'scale(.6)';
    g.style.transition = `opacity .35s var(--smooth) ${.3 + i * .12}s, transform .6s var(--smooth) ${.3 + i * .12}s`;
    svg.append(g);
  });
  const hub = el('g', {class: 'petal'});
  hub.append(el('circle', {cx: C, cy: C, r: r0 - 4, fill: night ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.42)', stroke: night ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.9)', 'stroke-width': 1.5}));
  const n = el('text', {x: C, y: C + 4, 'text-anchor': 'middle', 'font-size': (small ? 40 : 64) * k, 'font-weight': 700, style: 'fill:var(--ink);font-family:var(--rounded)', 'letter-spacing': -1.5}); n.textContent = '37';
  const sub = el('text', {x: C, y: C + 4 + (small ? 22 : 22) * k, 'text-anchor': 'middle', 'font-size': (small ? 15 : 17) * k, style: 'fill:var(--ink2)'}); sub.textContent = 'years 11 months';
  hub.append(n, sub); hub.style.transformBox = 'view-box'; hub.style.transformOrigin = '230px 230px'; hub.style.opacity = 0; hub.style.transform = 'scale(.8)';
  hub.style.transition = 'opacity .3s var(--smooth) 1.1s, transform .55s var(--bounce) 1.1s';
  svg.append(hub);
}

function arrive(room) {
  room.classList.add('in');
  room.querySelectorAll('.sl').forEach(l => l.style.strokeDashoffset = 0);
  room.querySelectorAll('.dot, .petal').forEach(g => { g.style.opacity = 1; g.style.transform = 'none'; });
}

document.querySelectorAll('[data-page]').forEach(page => {
  page.innerHTML = document.getElementById('tpl').innerHTML;
  if (still) page.classList.add('still');
  { const top = page.querySelector('.top'), cur = page.querySelector('.rooms a.on');
    if (cur) page.querySelectorAll('.menu a').forEach(a => a.classList.toggle('on', a.textContent === cur.textContent));
    const b = page.querySelector('.burger'); if (b) b.onclick = () => b.setAttribute('aria-expanded', String(top.classList.toggle('menu-on'))); }
  const ph = page.classList.contains('phone');
  if (page.querySelector('[data-film]')) { const v = page.querySelector('[data-film]'), [src, poster] = ph ? FILM.phone : FILM.desk;
    if (still) { const i = new Image(); i.src = poster; v.replaceWith(i); }
    else { v.poster = poster; v.src = src; v.play().catch(() => {});
      const pb = page.querySelector('.open .play'); if (pb) pb.onclick = () => { v.currentTime = 0; v.play(); v.scrollIntoView({behavior: 'smooth'}); }; } }
  page.querySelectorAll('.pearl').forEach((p, j) => {
    const th = p.parentNode.clientHeight, z = +p.dataset.z;
    p.style.top = (th / 2 - Math.max(-3, Math.min(3, z)) * th / 6) + 'px';
    p.style.transitionDelay = `${.5 + j * .12}s`;
  });
  page.querySelectorAll('[data-night]').forEach(drawNight);
  page.querySelectorAll('[data-wheel]').forEach(drawWheel);
  page.querySelectorAll('.rooms a[data-go]').forEach(a => { const ch = page.querySelector('.' + a.dataset.go);
    const ic = ch.querySelector('.k svg'); if (ic) { const c = ic.cloneNode(true); a.prepend(c);
      if (a.dataset.go === 'c-age') c.querySelectorAll('ellipse').forEach((e, i) => e.setAttribute('fill', ['#EF7A3C', '#F0BE45', '#8F8FE6', '#F25B83', '#6C66E6', '#8C8A88'][i])); }
    a.onclick = () => ch.scrollIntoView({behavior: 'smooth'}); });
  if (!still) { const top = page.querySelector('.top'), film = page.querySelector('.open, .rdopen'), links = page.querySelectorAll('.rooms a[data-go]');
    const tick = () => { const y = top.getBoundingClientRect().bottom;
      const hl = film.querySelector('h1'); top.classList.toggle('glass', hl ? hl.getBoundingClientRect().top < y + 12 : film.getBoundingClientRect().bottom < y + 40);
      links.forEach(a => { const r = page.querySelector('.' + a.dataset.go).getBoundingClientRect(); a.classList.toggle('on', r.top <= y + 1 && r.bottom > y + 1); }); };
    addEventListener('scroll', tick, {passive: true}); tick(); }
  const rooms = page.querySelectorAll('[data-room]');
  if (still || matchMedia('(prefers-reduced-motion: reduce)').matches) { rooms.forEach(arrive); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { arrive(e.target); io.unobserve(e.target); } }), {rootMargin: '0px 0px -18% 0px'}); /* a room arrives when its top passes 82% of the screen, however tall it is */
  rooms.forEach(r => io.observe(r));
});


/* a link to a part of the page (privacy.html#planner) lands on it once the page is drawn */
if (location.hash.length > 1 && !still) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) requestAnimationFrame(() => t.scrollIntoView()); }
