<style>
.fr{padding-block:8px 72px}
.fr-intro{margin:0 0 28px;color:var(--muted);font-size:clamp(17px,2.2vw,19px);line-height:1.5;max-width:46ch}
.fr-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
.fr-new input,.fr-new textarea{display:block;width:100%;border:0;background:transparent;color:var(--text);font:inherit;padding:18px 22px 6px;outline:none}
.fr-new input::placeholder,.fr-new textarea::placeholder,.fr-tools input::placeholder{color:var(--faint)}
.fr-new input[name=title]{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;font-size:19px;font-weight:620;letter-spacing:-.01em;padding-bottom:16px}
.fr-new.open input[name=title]{padding-bottom:6px}
.fr-new textarea{min-height:84px;resize:vertical;font-size:16px;padding-top:4px}
.fr-new label{display:block;padding:12px 22px 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.fr-new input[name=email]{font-size:16px;padding-bottom:14px}
.fr-new .more{display:none}.fr-new.open .more{display:block}
.fr-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--border)}
.fr-btn{min-height:44px;padding:0 20px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.fr-btn.primary{background:var(--accent);color:#17120a}
.fr-btn:active{transform:scale(.96);transition-duration:0s}
.fr-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 14px}
.fr-tools h2{margin:0;font-size:clamp(22px,3vw,27px)}
.fr-tools .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fr-tools input{font:inherit;font-size:15px;min-height:40px;width:160px;max-width:100%;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface-solid);color:var(--text)}
.fr-row{display:flex;gap:16px;align-items:flex-start;padding:20px 22px;border-top:1px solid var(--border)}
.fr-row:first-child{border-top:0}
.fr-row .txt{flex:1;min-width:0}
.fr-row h3{margin:0 0 4px;font-size:17px;font-weight:620;letter-spacing:-.01em}
.fr-row p{margin:0 0 10px;font-size:15.5px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fr-pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted)}
.fr-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-open{display:none}
.s-review{color:var(--faint)}
.s-planned{color:#8a7cf0}
.s-progress{color:var(--accent)}
.s-done{color:var(--green)}
.fr-vote{flex:none;display:grid;place-items:center;gap:2px;width:52px;min-height:56px;padding:6px 0;border-radius:16px;border:1px solid var(--border);background:var(--surface-solid);color:var(--text);font:inherit;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;font-size:16px;font-weight:660;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .35s cubic-bezier(.22,1,.36,1),background-color .2s ease}
.fr-vote svg{width:13px;height:13px;color:var(--faint)}
.fr-vote:active{transform:scale(.94);transition-duration:0s}
.fr-vote[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#17120a}
.fr-vote[aria-pressed=true] svg{color:#17120a}
.fr-empty,.fr-note{padding:32px 22px;text-align:center;color:var(--faint);font-size:15.5px;margin:0}
.fr-note{padding:0 22px 12px;text-align:left}
@media (max-width:560px){.fr-tools .ctl{width:100%}.fr-tools input{flex:1;width:auto}}
@media (prefers-reduced-motion:reduce){.fr-btn,.fr-vote{transition:none}.fr-btn:active,.fr-vote:active{transform:none}}
</style>
<div class="wrap page-head">
  <p class="eyebrow">Aera</p>
  <h1>Feature requests</h1>
</div>
<div class="wrap fr">
  <p class="fr-intro">Tell us what you would like Aera to do, and vote for the ideas you want most. No account needed. Every request is read by the person who builds Aera.</p>
  <form class="fr-card fr-new" id="frNew" autocomplete="off">
    <input name="title" maxlength="120" required placeholder="What would you like Aera to do?">
    <div class="more">
      <label for="frDet">Details</label>
      <textarea id="frDet" name="details" maxlength="2000" placeholder="How would you use it?"></textarea>
      <label for="frMail">Email, optional</label>
      <input id="frMail" name="email" type="email" maxlength="200" placeholder="To hear when it ships">
      <p class="fr-note" id="frMsg" hidden></p>
      <div class="fr-bar"><button type="button" class="fr-btn" id="frCancel">Cancel</button><button class="fr-btn primary">Send request</button></div>
    </div>
  </form>
  <div class="fr-tools" id="list">
    <h2>Requests <span id="frCount" style="color:var(--faint);font-weight:500"></span></h2>
    <div class="ctl">
      <div class="seg" role="radiogroup" aria-label="Sort">
        <input type="radio" name="frSort" id="s1" value="trending" checked><label for="s1">Trending</label>
        <input type="radio" name="frSort" id="s2" value="top"><label for="s2">Top</label>
        <input type="radio" name="frSort" id="s3" value="new"><label for="s3">New</label>
      </div>
      <input id="frSearch" type="search" placeholder="Search" aria-label="Search requests">
    </div>
  </div>
  <section class="fr-card" style="padding:0" id="frRows"><p class="fr-empty">Loading requests</p></section>
  <p class="meta">For a bug, write to <a href="support.html">Support</a> so we can reply to you.</p>
</div>
<script>
(function(){
var API=window.FR_API||"https://requests.aerahealth.app";
var LABEL={review:"Under review",planned:"Planned",progress:"In progress",done:"Done"};
var posts=[],mine={};
try{mine=JSON.parse(localStorage.getItem("frVotes")||"{}")}catch(e){}
var voter;try{voter=localStorage.getItem("frVoter");if(!voter){voter=crypto.randomUUID();localStorage.setItem("frVoter",voter)}}catch(e){voter=String(Math.random()).slice(2)+Date.now()}
var $=function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function score(p){var h=(Date.now()-p.created)/36e5;return p.votes/Math.pow(h+2,1.2)}
function draw(){
  var q=$("frSearch").value.trim().toLowerCase(),s=(document.querySelector("input[name=frSort]:checked")||{}).value;
  var list=posts.filter(function(p){return !q||(p.title+" "+(p.details||"")).toLowerCase().indexOf(q)>-1});
  list.sort(s==="top"?function(a,b){return b.votes-a.votes}:s==="new"?function(a,b){return b.created-a.created}:function(a,b){return score(b)-score(a)});
  $("frCount").textContent=posts.length||"";
  $("frRows").innerHTML=list.length?list.map(function(p){var on=!!mine[p.id];return '<div class="fr-row"><div class="txt"><h3>'+esc(p.title)+'</h3>'+(p.details?'<p>'+esc(p.details)+'</p>':'')+(LABEL[p.status]?'<span class="fr-pill s-'+p.status+'">'+LABEL[p.status]+'</span>':'')+'</div><button class="fr-vote" data-id="'+p.id+'" aria-pressed="'+on+'" aria-label="Vote, '+p.votes+' votes"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'+p.votes+'</button></div>'}).join(""):'<p class="fr-empty">'+(q?"Nothing matches yet. Add it above.":"No requests yet. Be the first.")+'</p>';
}
function call(path,body){if(window.FR_DEMO)return Promise.resolve(window.FR_DEMO(path,body));return fetch(API+path,body?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:{}).then(function(r){if(!r.ok)throw r;return r.json()})}
call("/posts").then(function(p){posts=p;draw()}).catch(function(){posts=[];draw()});
document.querySelectorAll("input[name=frSort]").forEach(function(r){r.onchange=draw});$("frSearch").oninput=draw;
$("frRows").onclick=function(e){var b=e.target.closest(".fr-vote");if(!b)return;var id=b.dataset.id,p=posts.find(function(x){return x.id===id});
  var on=!mine[id];p.votes+=on?1:-1;if(on)mine[id]=1;else delete mine[id];try{localStorage.setItem("frVotes",JSON.stringify(mine))}catch(e){}draw();
  call("/vote",{id:id,voter:voter}).then(function(r){p.votes=r.votes;draw()}).catch(function(){})};
var f=$("frNew");f.title.onfocus=function(){f.classList.add("open")};
$("frCancel").onclick=function(){f.reset();f.classList.remove("open");$("frMsg").hidden=true};
f.onsubmit=function(e){e.preventDefault();var b={title:f.title.value,details:f.details.value,email:f.email.value,voter:voter};
  call("/posts",b).then(function(p){mine[p.id]=1;try{localStorage.setItem("frVotes",JSON.stringify(mine))}catch(e){}posts.push(p);f.reset();f.classList.remove("open");document.getElementById("s3").checked=true;draw()})
  .catch(function(){var m=$("frMsg");m.hidden=false;m.textContent="That did not go through. Try again in a minute."})};
})();
</script>
