<style>
.fr{display:grid;gap:32px;padding-block:24px 64px}
@media (min-width:900px){.fr{grid-template-columns:240px minmax(0,1fr)}}
.fr-side h4{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.fr-side a{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,currentColor 7%,transparent);color:inherit;text-decoration:none;font-weight:500;font-size:15px}
.fr-side a span{opacity:.6;font-size:13px;font-variant-numeric:tabular-nums}
.fr-main{padding:0;min-width:0}
.fr-main h1{margin:0 0 8px;font-size:clamp(28px,4.4vw,40px)}
.fr-intro{margin:0 0 20px;opacity:.75;line-height:1.5}
.fr .fr-box{padding:0;min-height:0;border:1px solid color-mix(in srgb,currentColor 14%,transparent);border-radius:14px;overflow:hidden;margin-bottom:20px}
.fr-new input,.fr-new textarea{display:block;width:100%;box-sizing:border-box;border:0;background:transparent;color:inherit;font:inherit;padding:14px 16px 4px;outline:none}
.fr-new input[name=title]{font-size:17px;font-weight:600}
.fr-new textarea{min-height:76px;resize:vertical;font-size:15px;padding-top:6px}
.fr-new label{display:block;padding:10px 16px 0;font-size:13px;font-weight:600;opacity:.7}
.fr-new input[name=email]{font-size:15px;padding-bottom:12px}
.fr-new .more{display:none}.fr-new.open .more{display:block}
.fr-bar{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;background:color-mix(in srgb,currentColor 4%,transparent);border-top:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.fr-btn{min-height:40px;padding:0 18px;border-radius:10px;border:1px solid color-mix(in srgb,currentColor 18%,transparent);background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.fr-btn.primary{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
@media (prefers-color-scheme:dark){.fr-btn.primary{background:#f5f5f7;color:#000;border-color:#f5f5f7}}
.fr-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:color-mix(in srgb,currentColor 4%,transparent);border-bottom:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.fr-head select{font:inherit;font-weight:600;border:0;background:transparent;color:inherit;padding:4px 2px;border-bottom:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.fr-head input{font:inherit;font-size:15px;min-height:38px;width:150px;max-width:100%;box-sizing:border-box;padding:0 12px;border-radius:10px;border:1px solid color-mix(in srgb,currentColor 18%,transparent);background:transparent;color:inherit}
.fr-row{display:flex;gap:16px;align-items:flex-start;padding:16px;border-top:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.fr-row:first-child{border-top:0}
.fr-row h3{margin:0 0 4px;font-size:16px;font-weight:600}
.fr-row p{margin:0 0 8px;font-size:15px;line-height:1.45;opacity:.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fr-row .txt{flex:1;min-width:0}
.fr-pill{display:inline-block;padding:2px 9px;border-radius:7px;font-size:12.5px;font-weight:600}
.s-open{display:none}
.s-review{background:rgba(142,142,147,.16)}
.s-planned{background:rgba(10,132,255,.14);color:#0a6bd6}
.s-progress{background:rgba(191,90,242,.15);color:#9a3fd0}
.s-done{background:rgba(48,176,80,.15);color:#228a3d}
@media (prefers-color-scheme:dark){.s-planned{color:#64aaff}.s-progress{color:#d08cf7}.s-done{color:#5fd27a}}
.fr-vote{flex:none;display:grid;place-items:center;width:44px;min-height:48px;padding:4px 0;border-radius:10px;border:1px solid color-mix(in srgb,currentColor 18%,transparent);background:transparent;color:inherit;font:inherit;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.fr-vote svg{width:12px;height:12px}
.fr-vote[aria-pressed=true]{border-color:#1d1d1f;background:#1d1d1f;color:#fff}
@media (prefers-color-scheme:dark){.fr-vote[aria-pressed=true]{border-color:#f5f5f7;background:#f5f5f7;color:#000}}
.fr-empty,.fr-note{padding:28px 16px;text-align:center;opacity:.65;font-size:15px}
.fr-note{padding:0 16px 12px;text-align:left}
</style>
<div class="wrap fr">
  <aside class="fr-side">
    <h4>Boards</h4>
    <a href="#list">Feature requests <span id="frCount"></span></a>
  </aside>
  <main class="fr-main">
    <h1>Feature requests</h1>
    <p class="fr-intro">Tell us what you would like Aera to do, and vote for the ideas you want most. Search first, your idea may already be here. No account needed. For a bug, email <a href="support.html">Support</a> so we can reply.</p>
    <form class="fr-box fr-new" id="frNew" autocomplete="off">
      <input name="title" maxlength="120" required placeholder="Short, descriptive title">
      <div class="more">
        <label for="frDet">Details</label>
        <textarea id="frDet" name="details" maxlength="2000" placeholder="What would you use it for?"></textarea>
        <label for="frMail">Email, if you want to hear when it ships (optional)</label>
        <input id="frMail" name="email" type="email" maxlength="200" placeholder="you@example.com">
        <p class="fr-note" id="frMsg" hidden></p>
        <div class="fr-bar"><button type="button" class="fr-btn" id="frCancel">Cancel</button><button class="fr-btn primary">Submit</button></div>
      </div>
    </form>
    <section class="fr-box" id="list">
      <div class="fr-head">
        <label>Showing <select id="frSort"><option value="trending">Trending</option><option value="top">Top</option><option value="new">New</option></select> requests</label>
        <input id="frSearch" type="search" placeholder="Search">
      </div>
      <div id="frRows"><p class="fr-empty">Loading requests</p></div>
    </section>
  </main>
</div>
<script>
(function(){
var API=window.FR_API||"https://requests.aerahealth.app";
var LABEL={review:"Under review",planned:"Planned",progress:"In progress",done:"Done"};
var posts=[],mine={};
try{mine=JSON.parse(localStorage.getItem("frVotes")||"{}")}catch(e){}
var voter;try{voter=localStorage.getItem("frVoter");if(!voter){voter=crypto.randomUUID();localStorage.setItem("frVoter",voter)}}catch(e){voter=String(Math.random()).slice(2)+Date.now()}
var $=function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function score(p){var h=(Date.now()-p.created)/36e5;return p.votes/Math.pow(h+2,1.2)}
function draw(){
  var q=$("frSearch").value.trim().toLowerCase(),s=$("frSort").value;
  var list=posts.filter(function(p){return !q||(p.title+" "+(p.details||"")).toLowerCase().indexOf(q)>-1});
  list.sort(s==="top"?function(a,b){return b.votes-a.votes}:s==="new"?function(a,b){return b.created-a.created}:function(a,b){return score(b)-score(a)});
  $("frCount").textContent=posts.length||"";
  $("frRows").innerHTML=list.length?list.map(function(p){var on=!!mine[p.id];return '<div class="fr-row"><div class="txt"><h3>'+esc(p.title)+'</h3>'+(p.details?'<p>'+esc(p.details)+'</p>':'')+(LABEL[p.status]?'<span class="fr-pill s-'+p.status+'">'+LABEL[p.status]+'</span>':'')+'</div><button class="fr-vote" data-id="'+p.id+'" aria-pressed="'+on+'" aria-label="Vote, '+p.votes+' votes"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'+p.votes+'</button></div>'}).join(""):'<p class="fr-empty">'+(q?"Nothing matches yet. Add it above.":"No requests yet. Be the first.")+'</p>';
}
function call(path,body){if(window.FR_DEMO)return Promise.resolve(window.FR_DEMO(path,body));return fetch(API+path,body?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:{}).then(function(r){if(!r.ok)throw r;return r.json()})}
call("/posts").then(function(p){posts=p;draw()}).catch(function(){posts=[];draw()});
$("frSort").onchange=draw;$("frSearch").oninput=draw;
$("frRows").onclick=function(e){var b=e.target.closest(".fr-vote");if(!b)return;var id=b.dataset.id,p=posts.find(function(x){return x.id===id});
  var on=!mine[id];p.votes+=on?1:-1;if(on)mine[id]=1;else delete mine[id];try{localStorage.setItem("frVotes",JSON.stringify(mine))}catch(e){}draw();
  call("/vote",{id:id,voter:voter}).then(function(r){p.votes=r.votes;draw()}).catch(function(){})};
var f=$("frNew");f.title.onfocus=function(){f.classList.add("open")};
$("frCancel").onclick=function(){f.reset();f.classList.remove("open");$("frMsg").hidden=true};
f.onsubmit=function(e){e.preventDefault();var b={title:f.title.value,details:f.details.value,email:f.email.value,voter:voter};
  call("/posts",b).then(function(p){mine[p.id]=1;try{localStorage.setItem("frVotes",JSON.stringify(mine))}catch(e){}posts.push(p);f.reset();f.classList.remove("open");$("frSort").value="new";draw()})
  .catch(function(){var m=$("frMsg");m.hidden=false;m.textContent="That did not go through. Try again in a minute."})};
})();
</script>
